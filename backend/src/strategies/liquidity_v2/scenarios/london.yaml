# London session scenarios
# Add one entry per trading day. Format (same as scenarios/ny.yaml):
#
# scenarios:
#   - name: "MNQ - 2024-08-01"
#     pair: "MNQ"
#     tf: "1m"
#     start: "2024-08-01 06:00:00Z"
#     end:   "2024-08-01 16:00:00Z"
#     lines:
#       - { price: 19319.25, at: "2024-08-01 06:00:00" }
#     expect:
#       entry: 19280.00
#       sl:    19250.00
#       tp:    19430.00
#       reentry:            # optional
#         entry: 19285.00
#         sl:    19255.00
#         tp:    19435.00
#     # or: expect: { none: true }  when no trade should trigger

scenarios: []

  - name: "MNQ - 2026-07-17"
    pair: "MNQ"
    tf: "5m"
    start: "2026-07-17 00:00:00Z"
    end:   "2026-07-17 16:00:00Z"
    lines:
      - { price: 28578.50, at: "2026-07-17 01:00:00" }
    expect:
      none: true
