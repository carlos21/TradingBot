<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chart Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Your custom CSS -->
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="flex h-screen">
  <!-- Main chart column -->
  <div class="flex-1 flex flex-col">
    <!-- Header with timeframe buttons and replay controls -->
    <header class="p-4 bg-gray-800 text-white">
      <div class="flex justify-between items-center">
        <!-- Left group: timeframes -->
        <div class="flex items-center space-x-4">
          <!-- Timeframe buttons -->
          <div class="flex space-x-2">
            <button data-timeframe="1m"  class="px-2 py-1 rounded bg-gray-900 text-white">1m</button>
            <button data-timeframe="5m"  class="px-2 py-1 rounded bg-gray-900 text-white">5m</button>
            <button data-timeframe="15m" class="px-2 py-1 rounded bg-gray-900 text-white">15m</button>
            <button data-timeframe="30m" class="px-2 py-1 rounded bg-gray-900 text-white">30m</button>
            <button data-timeframe="1h"  class="px-2 py-1 rounded bg-gray-900 text-white">1h</button>
            <button data-timeframe="4h"  class="px-2 py-1 rounded bg-gray-900 text-white">4h</button>
          </div>
        </div>

        <div class="flex items-center space-x-4">
          <span id="liveIndicator" class="hidden px-3 py-1 bg-red-600 text-white font-bold rounded animate-pulse">LIVE</span>
          <div id="testTradeControls" class="hidden flex items-center space-x-2">
            <button id="testLongBtn" class="px-3 py-1 bg-green-600 text-white rounded font-bold">Test Long</button>
            <button id="testShortBtn" class="px-3 py-1 bg-red-600 text-white rounded font-bold">Test Short</button>
            <button id="closeAllBtn" class="px-3 py-1 bg-orange-600 text-white rounded font-bold">Close All</button>
          </div>
          <button id="prevDayBtn" class="replay-control">◀ Prev day</button>
          <button id="nextDayBtn" class="replay-control">Next day ▶</button>
          <span id="currentDayLabel"></span>
        </div>

        <!-- Right group: Play/Pause -->
        <div class="flex items-center space-x-4">
          <button
            id="toggleReplayBtn"
            class="px-4 py-2 bg-blue-500 text-white rounded"
          >
            Play
          </button>
          <button
            id="stepBarBtn"
            class="px-4 py-2 bg-gray-600 text-white rounded"
            title="Step one bar"
          >
            &#x23ED;
          </button>
        </div>
      </div>
    </header>

    <!-- Chart area -->
    <main class="flex-1 flex flex-col relative">
      <!-- Single Chart Container occupying full remaining height -->
      <div id="chartContainer" class="w-full h-full bg-white"></div>
    </main>
  </div>


  <!-- Socket.IO & Main JS -->
  <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
