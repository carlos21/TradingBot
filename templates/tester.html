<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chart Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Your custom CSS -->
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="flex h-screen">
  <!-- Main chart column -->
  <div class="flex-1 flex flex-col">
    <!-- Header with timeframe buttons, stop-loss controls, and trade actions -->
    <header class="p-4 bg-gray-800 text-white">
      <div class="flex justify-between items-center">
        <!-- Left group: timeframes + stop-loss + trade actions -->
        <div class="flex items-center space-x-4">
          <!-- Timeframe buttons -->
          <div class="flex space-x-2">
            <button data-timeframe="1m"  class="px-2 py-1 rounded bg-gray-900 text-white">1m</button>
            <button data-timeframe="5m"  class="px-2 py-1 rounded bg-gray-900 text-white">5m</button>
            <button data-timeframe="15m" class="px-2 py-1 rounded bg-gray-900 text-white">15m</button>
            <button data-timeframe="1h"  class="px-2 py-1 rounded bg-gray-900 text-white">1h</button>
            <button data-timeframe="4h"  class="px-2 py-1 rounded bg-gray-900 text-white">4h</button>
          </div>
          
          <!-- Stop-Loss controls -->
          <div id="stop-loss-group" class="flex items-center space-x-2">
            <label class="text-white">
              Stop Loss: <span id="stop-loss-value">100.00</span>
            </label>
            <button id="decrease-stop-loss" class="px-2 py-1 rounded border bg-gray-900 text-white">-</button>
            <button id="increase-stop-loss" class="px-2 py-1 rounded border bg-gray-900 text-white">+</button>
          </div>
          
          <!-- Trade Actions -->
          <div id="trade-actions-group" class="flex items-center space-x-2">
            <button id="buy-button" class="px-4 py-2 rounded border bg-gray-500 text-white">BUY</button>
            <button id="sell-button" class="px-4 py-2 rounded border bg-gray-500 text-white">SELL</button>
            <button id="open-trade-button" class="px-4 py-2 bg-blue-500 text-white rounded">
              Open Trade
            </button>
            <button id="close-trade-button" class="px-4 py-2 bg-orange-500 text-white rounded" disabled>
              Close Trade
            </button>
          </div>
        </div>
    
        <!-- Right group: PnL display + Play/Pause -->
        <div class="flex items-center space-x-4">
          <div>Wins: <span id="winCount">0</span></div>
          <div>Losses: <span id="lossCount">0</span></div>
          <div>PnL: <span id="pnlCounter">0%</span></div>
          <button
            id="toggleReplayBtn"
            class="px-4 py-2 bg-blue-500 text-white rounded"
          >
            Play
          </button>
        </div>
      </div>
    </header>

    <!-- Chart area -->
    <main class="flex-1 relative">
      <div id="chartContainer" class="w-full h-full"></div>
    </main>
  </div>

  <!-- Fixed-width watchlist on the right -->
  <aside
    id="watchlist"
    class="w-64 p-4 bg-gray-100 overflow-y-auto border-l border-gray-300"
  >
    <h3 class="font-bold text-lg mb-4">Watchlist</h3>
    <div id="watchlistItems" class="flex flex-col space-y-2"></div>
  </aside>

  <!-- Socket.IO & Main JS -->
  <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
